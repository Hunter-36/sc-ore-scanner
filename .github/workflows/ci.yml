name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core (Rust) unit + e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Format check
        run: cargo fmt --manifest-path core/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path core/Cargo.toml -- -D warnings

      # build.rs fetches the ocrs models; the e2e test runs the real OCR over the
      # capture fixtures (the Rust port of the old Python manifest e2e).
      - name: Test (unit + OCR accuracy e2e)
        run: cargo test --manifest-path core/Cargo.toml --release

  frontend-unit:
    name: Frontend typecheck + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (vitest)
        run: pnpm test

  tauri-check:
    name: Tauri (Rust) check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: cargo check
        run: cargo check --manifest-path frontend/src-tauri/Cargo.toml

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    # Advisory only — surfaces vulns without blocking merges (transitive
    # advisories we can't immediately fix shouldn't gate releases).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (core)
        run: cargo audit --file core/Cargo.lock
      - name: cargo audit (app)
        run: cargo audit --file frontend/src-tauri/Cargo.lock
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: pnpm audit
        working-directory: frontend
        run: pnpm audit --prod

  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check version strings agree
        run: |
          PKG=$(node -p "require('./frontend/package.json').version")
          TAURI=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          CARGO=$(grep -E '^version *=' frontend/src-tauri/Cargo.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "package.json=$PKG  tauri.conf.json=$TAURI  Cargo.toml=$CARGO"
          if [ "$PKG" != "$TAURI" ] || [ "$PKG" != "$CARGO" ]; then
            echo "::error::Version mismatch — bump package.json, tauri.conf.json and Cargo.toml to the same value."
            exit 1
          fi
          echo "Versions agree: $PKG"
