name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install system libs (OpenCV + headless X for mss)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 xvfb

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dev dependencies (core, no ML stack)
        run: uv pip install --system -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run unit tests
        # mss opens an X display in the FastAPI lifespan, so run under xvfb.
        run: xvfb-run -a pytest tests/unit

  frontend-unit:
    name: Frontend typecheck + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (vitest)
        run: pnpm test

  rust-check:
    name: Tauri (Rust) check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: cargo check
        run: cargo check --manifest-path frontend/src-tauri/Cargo.toml

  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version strings agree
        run: |
          PKG=$(node -p "require('./frontend/package.json').version")
          TAURI=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          CARGO=$(grep -E '^version *=' frontend/src-tauri/Cargo.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "package.json=$PKG  tauri.conf.json=$TAURI  Cargo.toml=$CARGO"
          if [ "$PKG" != "$TAURI" ] || [ "$PKG" != "$CARGO" ]; then
            echo "::error::Version mismatch — bump package.json, tauri.conf.json and Cargo.toml to the same value."
            exit 1
          fi
          echo "Versions agree: $PKG"
