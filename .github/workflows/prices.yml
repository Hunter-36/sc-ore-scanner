name: Prices

# Fetches Star Citizen ore prices from UEX Corp (public /commodities endpoint —
# no token needed) and publishes a small prices.json to GitHub Pages, which the
# app reads on a timer. UEX is community-reported/averaged data
# (a guideline, not a live per-terminal quote), but prices do drift with player
# supply/demand — so we refresh hourly. Cheap to change.
#
# One-time setup: enable GitHub Pages with "Source: GitHub Actions"
# (repo Settings -> Pages).
on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

# Don't run overlapping deploys.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build prices.json from UEX
        run: python scripts/fetch_prices.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
