name: Release

# Builds the portable Windows zip and drafts a GitHub Release when a version
# tag is pushed, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build portable Windows zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build overlay (no installer bundle)
        run: pnpm tauri build --no-bundle
        working-directory: frontend

      - name: Assemble portable zip
        shell: pwsh
        run: |
          $stage = "staging"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # Prebuilt overlay binary (launched by launch.bat, not by the user)
          Copy-Item "frontend/src-tauri/target/release/sc-ore-scanner.exe" `
                    -Destination (Join-Path $stage "SC Ore Scanner.exe")

          # Backend source (no deps, no tests, no venv)
          $be = Join-Path $stage "backend"
          New-Item -ItemType Directory -Force -Path $be | Out-Null
          Copy-Item "backend/src"  -Destination $be -Recurse
          Copy-Item "backend/data" -Destination $be -Recurse
          Copy-Item "backend/main.py","backend/calibrate.py" -Destination $be
          Copy-Item "backend/requirements*.txt" -Destination $be

          # Launcher scripts + readme
          Copy-Item "packaging/setup.bat","packaging/launch.bat" -Destination $stage
          Copy-Item "packaging/README.txt" -Destination $stage

          # Drop any stray __pycache__ that might have been copied
          Get-ChildItem -Path $be -Recurse -Directory -Filter "__pycache__" |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          $zip = "sc-ore-scanner-$($env:GITHUB_REF_NAME)-windows.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force
          echo "ZIP_NAME=$zip" >> $env:GITHUB_ENV

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "SC Ore Scanner ${{ github.ref_name }}"
          body_path: packaging/RELEASE_NOTES.md
          draft: true
          files: ${{ env.ZIP_NAME }}
