name: Release

# Auto-release on merge to master: if the version in package.json doesn't yet
# have a published release, build the single-binary app + installers, tag it, and
# publish. If the version is unchanged (e.g. a docs/chore merge), this is a no-op.
#
# Also fires on a manually pushed v* tag, or via the Actions "Run workflow" button.
on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      should_release: ${{ steps.decide.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(node -p "require('./frontend/package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will release $TAG."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: Build + publish ${{ needs.check.outputs.tag }}
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build app + installers (NSIS + MSI)
        run: pnpm tauri build
        working-directory: frontend

      - name: Collect release artifacts
        shell: pwsh
        run: |
          $rel = "frontend/src-tauri/target/release"
          # Portable single exe, zipped with a friendly name.
          $stage = "staging"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$rel/sc-ore-scanner.exe" -Destination (Join-Path $stage "SC Ore Scanner.exe")
          $zip = "sc-ore-scanner-$($env:RELEASE_TAG)-windows-portable.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force
          echo "ZIP_NAME=$zip" >> $env:GITHUB_ENV
          # Installers.
          $nsis = Get-ChildItem "$rel/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $msi  = Get-ChildItem "$rel/bundle/msi/*.msi"        | Select-Object -First 1
          echo "NSIS_PATH=$($nsis.FullName)" >> $env:GITHUB_ENV
          echo "MSI_PATH=$($msi.FullName)"   >> $env:GITHUB_ENV
        env:
          RELEASE_TAG: ${{ needs.check.outputs.tag }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: "SC Ore Scanner ${{ needs.check.outputs.tag }}"
          # The install guide is prepended to GitHub's auto-generated, categorised
          # "What's Changed" changelog (built from merged PRs since the last release;
          # see .github/release.yml for the categories).
          body_path: docs/RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          make_latest: true
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.NSIS_PATH }}
            ${{ env.MSI_PATH }}
