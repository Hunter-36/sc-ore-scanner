name: Release

# Auto-release on merge to master: if the version in package.json doesn't yet
# have a published release, build the Windows zip, tag it, and publish. If the
# version is unchanged (e.g. a docs/chore merge), this is a no-op.
#
# Also fires on a manually pushed v* tag, or via the Actions "Run workflow" button.
on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      should_release: ${{ steps.decide.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(node -p "require('./frontend/package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will release $TAG."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: Build + publish ${{ needs.check.outputs.tag }}
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build overlay (no installer bundle)
        run: pnpm tauri build --no-bundle
        working-directory: frontend

      - name: Assemble portable zip
        shell: pwsh
        run: |
          $stage = "staging"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "frontend/src-tauri/target/release/sc-ore-scanner.exe" `
                    -Destination (Join-Path $stage "SC Ore Scanner.exe")
          $be = Join-Path $stage "backend"
          New-Item -ItemType Directory -Force -Path $be | Out-Null
          Copy-Item "backend/src"  -Destination $be -Recurse
          Copy-Item "backend/data" -Destination $be -Recurse
          Copy-Item "backend/main.py","backend/calibrate.py" -Destination $be
          Copy-Item "backend/requirements*.txt" -Destination $be
          Copy-Item "packaging/setup.bat","packaging/launch.bat" -Destination $stage
          Copy-Item "packaging/README.txt" -Destination $stage
          Get-ChildItem -Path $be -Recurse -Directory -Filter "__pycache__" |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          $zip = "sc-ore-scanner-$($env:RELEASE_TAG)-windows.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force
          echo "ZIP_NAME=$zip" >> $env:GITHUB_ENV
        env:
          RELEASE_TAG: ${{ needs.check.outputs.tag }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: "SC Ore Scanner ${{ needs.check.outputs.tag }}"
          # The install guide is prepended to GitHub's auto-generated, categorised
          # "What's Changed" changelog (built from merged PRs since the last release;
          # see .github/release.yml for the categories).
          body_path: packaging/RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          make_latest: true
          files: ${{ env.ZIP_NAME }}
