[package]
name = "scanner-core"
version = "0.1.0"
edition = "2021"
description = "Core detection logic for SC Ore Scanner (RS -> ore resolver, signatures, config)"
license = "MIT"
repository = "https://github.com/Hunter-36/sc-ore-scanner"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
image = "0.25"
ocrs = "0.10"
rten = "0.21"
ureq = { version = "2", features = ["tls"] }
log = "0.4"

[build-dependencies]
ureq = { version = "2", features = ["tls"] }
sha2 = "0.10"
